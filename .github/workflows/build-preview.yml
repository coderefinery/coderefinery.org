# Zola build workflow for pull request previews.
#
# Setting it up:
#   Adjust the variables below, under env.
#
#   It is a general limitation of gh-actions that they cannot make the very first
#   deploy to gh-pages.  It will seem to work, but not appear on the CDN to be
#   online.  You need to go to settings and set the gh-pages branch, then future
#   deploys will work.  See
#   https://github.com/marketplace/actions/github-pages-action#%EF%B8%8F-first-deployment-with-github_token
#
# Each pull request is deployed to previews/PR<number>/ on gh-pages, which also
# holds the production site at its root.  The deploy therefore only touches its
# own subdirectory and must never force-push.

name: Build and deploy website preview

env:
  ZOLA_VERSION: "0.22.1"
  CNAME: "coderefinery.org"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Same group as the other gh-pages writers, so previews and site deploys queue
# instead of overwriting each other.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # if this build is a PR build and the PR is NOT from a fork
    if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install zola
      run: |
        set -x
        wget -O - \
           "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
        | sudo tar xzf - -C /usr/local/bin

    - name: Generate HTML
      run: zola build --base-url "https://${{ env.CNAME }}/previews/PR${{ github.event.number }}"

    # Previews duplicate the production pages, so keep them out of search engines
    - name: Prevent indexing of the preview
      run: |
        printf 'User-agent: *\nDisallow: /\n' > public/robots.txt

    # clean only removes files inside target-folder, so rebuilding a PR replaces
    # its own preview and leaves the site and other previews alone.
    - name: Deploy preview
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public
        branch: gh-pages
        target-folder: previews/PR${{ github.event.number }}
        clean: true
        force: false
        attempt-limit: 5
        commit-message: "Preview for PR #${{ github.event.number }}"
